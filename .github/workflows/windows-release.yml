name: Windows preview build and lifecycle checks
on:
  workflow_dispatch:
    inputs:
      test_ollama:
        description: 'Run real installed-app Ollama generation, translation and notes (downloads a public model)'
        type: boolean
        default: false
      ollama_model:
        description: 'Public completion model for the optional real Ollama acceptance test'
        type: string
        default: 'qwen3.5:0.8b'
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install development dependencies
        run: python -m pip install -r windows-app/requirements-lock.txt
      - name: Unit and API checks including first-run wizard, downloads, secrets and device availability matrix
        env:
          PYTHONUTF8: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ruff check video_descriptor tests windows-app scripts/whisper_npu_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Build verified runtime, ZIP and installer
        run: |
          powershell -NoProfile -File windows-app/Prepare-Desktop.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -STA -File windows-app/Desktop.ps1 -Verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = & ./windows-app/Prepare-BuildTools.ps1
          python -X utf8 windows-app/build_release.py --iscc $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real WebView2 window, UI document and close-to-tray smoke
        run: python -X utf8 windows-app/verify_desktop.py --zip dist/VideoDescriptor-0.7.0-windows-x64.zip
      - name: Verify deterministic ZIP rebuild
        run: |
          python -X utf8 windows-app/build_release.py --output dist/rebuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $first = (Get-FileHash dist/VideoDescriptor-0.7.0-windows-x64.zip).Hash
          $second = (Get-FileHash dist/rebuild/VideoDescriptor-0.7.0-windows-x64.zip).Hash
          if ($first -ne $second) { throw 'ZIP is not reproducible from the same inputs' }
      - name: ZIP, install, running-update refusal, reinstall, upgrade fixture, uninstall
        run: |
          $compiler = Join-Path $PWD 'windows-app/runtime/build-cache/inno-6.7.3/ISCC.exe'
          python -X utf8 windows-app/verify_release.py dist/VideoDescriptor-0.7.0-windows-x64.zip --installer dist/VideoDescriptor-0.7.0-windows-x64-setup.exe --iscc $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache the pinned public Whisper test model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/vd-public-whisper
          key: windows-public-whisper-${{ hashFiles('windows-app/component-manifest.json') }}
      - name: Verify or download the public Whisper fixture
        run: |
          python -X utf8 windows-app/sandbox/prepare_test_model.py --destination "$env:RUNNER_TEMP/vd-public-whisper" --output dist/installed-acceptance/model-provenance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real installed build, model detection, CPU recognition and saved results through API
        run: |
          $fixture = Get-Content dist/installed-acceptance/model-provenance.json -Raw | ConvertFrom-Json
          python -X utf8 windows-app/verify_installed.py --installer dist/VideoDescriptor-0.7.0-windows-x64-setup.exe --zip dist/VideoDescriptor-0.7.0-windows-x64.zip --model $fixture.model_directory --output dist/installed-acceptance/report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache public Ollama dependency and test model for optional acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.test_ollama
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/vd-ollama-downloads
            ${{ runner.temp }}/vd-public-ollama-models
          key: windows-public-ollama-${{ hashFiles('windows-app/sandbox/ollama-test-input.json') }}-${{ inputs.ollama_model }}
      - name: Prepare isolated real Ollama and the requested public model
        if: github.event_name == 'workflow_dispatch' && inputs.test_ollama
        env:
          TEST_OLLAMA_MODEL: ${{ inputs.ollama_model }}
        run: |
          ./windows-app/sandbox/Prepare-TestOllama.ps1 -CacheDirectory "$env:RUNNER_TEMP/vd-ollama-downloads" -TargetDirectory "$env:RUNNER_TEMP/vd-ollama-install" -ModelDirectory "$env:RUNNER_TEMP/vd-public-ollama-models" -Model $env:TEST_OLLAMA_MODEL -HostAddress 127.0.0.1:11439 -ReportPath dist/ollama-acceptance/dependency.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real installed-app Ollama generation, translation, notes and exports through API
        if: github.event_name == 'workflow_dispatch' && inputs.test_ollama
        env:
          TEST_OLLAMA_MODEL: ${{ inputs.ollama_model }}
        run: |
          $fixture = Get-Content dist/installed-acceptance/model-provenance.json -Raw | ConvertFrom-Json
          python -X utf8 windows-app/verify_installed.py --installer dist/VideoDescriptor-0.7.0-windows-x64-setup.exe --zip dist/VideoDescriptor-0.7.0-windows-x64.zip --model $fixture.model_directory --output dist/ollama-acceptance/report.json --with-ollama --ollama-url http://127.0.0.1:11439 --ollama-model $env:TEST_OLLAMA_MODEL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stop only the optional acceptance Ollama process
        if: always() && github.event_name == 'workflow_dispatch' && inputs.test_ollama
        run: |
          if (Test-Path dist/ollama-acceptance/dependency.json) {
            $dependency = Get-Content dist/ollama-acceptance/dependency.json -Raw | ConvertFrom-Json
            $process = Get-Process -Id $dependency.server_pid -ErrorAction SilentlyContinue
            $expected = [IO.Path]::GetFullPath("$env:RUNNER_TEMP/vd-ollama-install/ollama.exe")
            if ($process -and $process.Path -eq $expected) { Stop-Process -Id $process.Id -Force }
          }
      - name: Retain preview artifacts and verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VideoDescriptor-windows-x64-preview
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.json
            dist/verification-release.json
            dist/verification-desktop.json
            dist/installed-acceptance/**
            dist/ollama-acceptance/**
          if-no-files-found: error
          retention-days: 14
