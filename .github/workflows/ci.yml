name: CI
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Configuration and paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      windows: ${{ steps.paths.outputs.windows }}
      installer: ${{ steps.paths.outputs.installer }}
      container: ${{ steps.paths.outputs.container }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.10
        cache: pip
        cache-dependency-path: requirements-ci.txt
    - name: Install configuration validators
      run: python -m pip install pytest==8.4.2 PyYAML==6.0.3
    - name: Workflow syntax and policy
      run: python scripts/check-fast.py --config-only
    - name: Route changed paths
      run: python scripts/ci_changes.py --base "$BASE" --head "$HEAD"
      id: paths
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  fast:
    name: Fast (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-2025
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.10
        cache: pip
        cache-dependency-path: |-
          ${{ runner.os == 'Windows' && 'windows-app/requirements-lock.txt' || 'requirements-container.lock' }}
          requirements-ci.txt
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.19.0
    - name: Linux locked dependencies
      run: |-
        python -m pip install --require-hashes -r requirements-container.lock
        python -m pip install -r requirements-ci.txt
        python -m pip install --no-deps --no-build-isolation -e .
        python -m pip check
      if: runner.os == 'Linux'
    - name: Windows locked dependencies
      run: |-
        python -m pip install -r windows-app/requirements-lock.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m pip check
      if: runner.os == 'Windows'
    - name: Linux static and unit checks once
      run: python scripts/check-fast.py --skip-config
      if: runner.os == 'Linux'
    - name: Windows-specific unit suite once
      run: python scripts/check-fast.py --unit-only
      if: runner.os == 'Windows'
  windows:
    needs:
    - changes
    - fast
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/windows-smoke.yml
    with:
      installer: ${{ needs.changes.outputs.installer == 'true' }}
  container:
    needs:
    - changes
    - fast
    if: needs.changes.outputs.container == 'true'
    uses: ./.github/workflows/container-smoke.yml
  required:
    name: required
    needs:
    - changes
    - fast
    - windows
    - container
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - name: Stable merge gate including conditional smoke results
      run: python -c 'import json,os; r=json.loads(os.environ["RESULTS"]); assert r["changes"]["result"]=="success";
        assert all(j["result"] in ("success","skipped") for j in r.values()), r'
      env:
        RESULTS: ${{ toJSON(needs) }}
