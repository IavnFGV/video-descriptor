name: Model and prompt behavior
'on':
  workflow_dispatch:
    inputs:
      ollama_model:
        type: string
        required: true
        default: qwen3.5:0.8b
        description: Explicit public model download for behavior evaluation (not release gating)
      few_shot:
        type: boolean
        default: false
        description: Append versioned examples; otherwise evaluate production baseline prompt
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      TEST_OLLAMA_MODEL: ${{ inputs.ollama_model }}
      USE_EXAMPLES: ${{ inputs.few_shot }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        check-latest: false
        cache: pip
        cache-dependency-path: windows-app/requirements-lock.txt
    - name: Pinned application dependencies
      run: python -m pip install -r windows-app/requirements-lock.txt
    - name: Cache explicit test dependency and model
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ${{ runner.temp }}/vd-ollama-downloads
          ${{ runner.temp }}/vd-public-ollama-models
        key: model-behavior-${{ hashFiles('windows-app/sandbox/ollama-test-input.json') }}-${{ inputs.ollama_model }}
    - name: Prepare isolated real Ollama and selected model
      run: |
        ./windows-app/sandbox/Prepare-TestOllama.ps1 -CacheDirectory "$env:RUNNER_TEMP/vd-ollama-downloads" -TargetDirectory "$env:RUNNER_TEMP/vd-ollama-install" -ModelDirectory "$env:RUNNER_TEMP/vd-public-ollama-models" -Model $env:TEST_OLLAMA_MODEL -HostAddress 127.0.0.1:11439 -ReportPath dist/model-behavior/dependency.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Real generation and prompt regressions
      run: |
        $options = @()
        if ($env:USE_EXAMPLES -eq 'true') { $options += @('--examples', 'tests/model-behavior/examples.json') }
        python -X utf8 scripts/evaluate_models.py --model $env:TEST_OLLAMA_MODEL --base-url http://127.0.0.1:11439 --output dist/model-behavior/results @options
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Stop only the task-owned model server
      if: always()
      run: |
        if (Test-Path dist/model-behavior/dependency.json) {
          $dependency = Get-Content dist/model-behavior/dependency.json -Raw | ConvertFrom-Json
          $process = Get-Process -Id $dependency.server_pid -ErrorAction SilentlyContinue
          $expected = [IO.Path]::GetFullPath("$env:RUNNER_TEMP/vd-ollama-install/ollama.exe")
          if ($process -and $process.Path -eq $expected) { Stop-Process -Id $process.Id -Force }
        }
    - name: Keep model identity, prompt hashes, case results and synthetic answers
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: model-behavior
        path: dist/model-behavior/**
        retention-days: 14
