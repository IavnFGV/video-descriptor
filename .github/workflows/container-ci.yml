name: Container CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-container.lock
      - name: Install CPU and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-container.lock
          python -m pip install -e '.[windows]' pytest ruff
          python -m pip check
      - name: Tests and Ruff
        run: |
          python -m pytest -q
          ruff check video_descriptor tests windows-app scripts/smoke_compose.py scripts/whisper_npu_server.py
      - name: Validate Compose and build CPU image
        run: |
          docker compose config --quiet
          docker compose build
      - name: Real server, queue, persistence and restart smoke without models
        run: python scripts/smoke_compose.py
