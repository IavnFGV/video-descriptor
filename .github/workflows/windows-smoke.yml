name: Windows Build and Smoke
'on':
  workflow_call:
    inputs:
      installer:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.10
        cache: pip
        cache-dependency-path: |-
          windows-app/requirements-lock.txt
          requirements-ci.txt
    - name: Development tools
      run: python -m pip install -r windows-app/requirements-lock.txt
    - name: Verified build downloads only (no staged payloads or user data)
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |-
          windows-app/runtime/build-cache/*.zip
          windows-app/runtime/build-cache/*.exe
          windows-app/runtime/build-cache/*.nupkg
          windows-app/runtime/build-cache/wheels
        key: windows-build-v1-${{ hashFiles('windows-app/release-inputs.json', 'windows-app/requirements-release.txt',
          'windows-app/release-wheels.json') }}
    - name: Desktop SDK
      run: powershell -NoProfile -File windows-app/Prepare-Desktop.ps1
    - name: Build ZIP once; installer only for packaging changes
      run: |-
        $arguments = @()
        if ($env:INSTALLER -eq 'true') {
          $compiler = & ./windows-app/Prepare-BuildTools.ps1
          $arguments = @('--iscc', $compiler)
        }
        python -X utf8 windows-app/build_release.py @arguments
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        INSTALLER: ${{ inputs.installer }}
    - name: Real packaged WebView2, health, tray and reconnect smoke
      run: python -X utf8 windows-app/verify_desktop.py --zip dist/VideoDescriptor-0.7.0-windows-x64.zip
    - name: ZIP manifest, offline backend and setup contracts
      run: python -X utf8 windows-app/verify_release.py dist/VideoDescriptor-0.7.0-windows-x64.zip
    - name: One installation smoke for packaging changes
      run: python -X utf8 scripts/check-installer-smoke.py dist/VideoDescriptor-0.7.0-windows-x64-setup.exe
      if: inputs.installer
    - name: Retain small smoke evidence only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: windows-smoke-reports
        path: |-
          dist/verification-*.json
          dist/SHA256SUMS.json
        retention-days: 5
