name: Container Build and Smoke
'on':
  workflow_call:
    inputs:
      retain_image:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.10
        cache: pip
        cache-dependency-path: requirements-ci.txt
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/buildkit
        key: container-layers-v1-${{ hashFiles('Dockerfile', 'requirements-container.lock') }}-${{ github.sha }}
        restore-keys: container-layers-v1-${{ hashFiles('Dockerfile', 'requirements-container.lock') }}-
    - name: Validate Compose and build once
      run: |-
        docker compose config --quiet
        docker buildx create --use
        docker buildx build --build-arg "APP_VERSION=$GITHUB_REF_NAME" --build-arg "VCS_REF=$GITHUB_SHA" --load -t video-descriptor:local --cache-from type=local,src="$RUNNER_TEMP/buildkit" --cache-to type=local,dest="$RUNNER_TEMP/buildkit-next",mode=max .
        rm -rf "$RUNNER_TEMP/buildkit"
        mv "$RUNNER_TEMP/buildkit-next" "$RUNNER_TEMP/buildkit"
    - name: Short backend, queue and persistence smoke (no models)
      run: python scripts/smoke_compose.py
    - name: Preserve the exact accepted image for release publication
      if: inputs.retain_image
      run: docker save video-descriptor:local | gzip > "$RUNNER_TEMP/container-image.tar.gz"
    - name: Accepted container image (Full only)
      if: inputs.retain_image
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: accepted-container-image
        path: ${{ runner.temp }}/container-image.tar.gz
        retention-days: 7
