name: Full Acceptance
'on':
  workflow_dispatch:
    inputs:
      ollama_model:
        type: string
        default: qwen3.5:0.8b
        description: Public model for explicit full acceptance
  workflow_call: {}
  release:
    types:
    - prereleased
    - published
permissions:
  contents: read
concurrency:
  group: full-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.10
        cache: pip
        cache-dependency-path: |-
          windows-app/requirements-lock.txt
          requirements-ci.txt
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.19.0
    - name: Resolve versioned artifact paths
      shell: pwsh
      run: |-
        $version = (Get-Content windows-app/release-inputs.json -Raw | ConvertFrom-Json).version
        "VD_ZIP=dist/VideoDescriptor-$version-windows-x64.zip" >> $env:GITHUB_ENV
        "VD_INSTALLER=dist/VideoDescriptor-$version-windows-x64-setup.exe" >> $env:GITHUB_ENV
        "VD_PREFIX=VideoDescriptor-$version-windows-x64" >> $env:GITHUB_ENV
    - name: Locked test dependencies
      run: python -m pip install -r windows-app/requirements-lock.txt
    - name: Fast checks once on Windows
      run: python scripts/check-fast.py
    - name: Verified build downloads only (no staged payloads or user data)
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |-
          windows-app/runtime/build-cache/*.zip
          windows-app/runtime/build-cache/*.exe
          windows-app/runtime/build-cache/*.nupkg
          windows-app/runtime/build-cache/wheels
        key: windows-build-v1-${{ hashFiles('windows-app/release-inputs.json', 'windows-app/requirements-release.txt',
          'windows-app/release-wheels.json') }}
    - name: Build verified runtime, ZIP and installer
      run: |
        powershell -NoProfile -File windows-app/Prepare-Desktop.ps1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        powershell -NoProfile -STA -File windows-app/Desktop.ps1 -Verify
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $compiler = & ./windows-app/Prepare-BuildTools.ps1
        python -X utf8 windows-app/build_release.py --iscc $compiler
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if: github.event_name != 'release'
    - name: Verify deterministic ZIP rebuild
      run: |
        python -X utf8 windows-app/build_release.py --output dist/rebuild
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $first = (Get-FileHash "$env:VD_ZIP").Hash
        $second = (Get-FileHash "dist/rebuild/$env:VD_PREFIX.zip").Hash
        if ($first -ne $second) { throw 'ZIP is not reproducible from the same inputs' }
      if: github.event_name != 'release'
    - name: Use the exact published assets; never rebuild a release substitute
      run: |-
        New-Item -ItemType Directory -Force dist | Out-Null
        gh release download "$env:RELEASE_TAG" --dir dist --pattern "$env:VD_PREFIX*" --pattern SHA256SUMS.json --pattern acceptance-provenance.json
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
    - name: Record provenance of built artifacts
      run: python scripts/ci_artifacts.py --record
      if: github.event_name != 'release'
    - name: Verify exact artifact hashes and revision
      run: python scripts/ci_artifacts.py
    - name: Real WebView2 window, UI document and close-to-tray smoke
      run: python -X utf8 windows-app/verify_desktop.py --zip "$env:VD_ZIP"
    - name: ZIP, install, running-update refusal, reinstall, upgrade fixture, uninstall
      run: |
        $compiler = & ./windows-app/Prepare-BuildTools.ps1
        python -X utf8 windows-app/verify_release.py "$env:VD_ZIP" --installer "$env:VD_INSTALLER" --iscc $compiler
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Cache the pinned public Whisper test model
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/vd-public-whisper
        key: windows-public-whisper-${{ hashFiles('windows-app/component-manifest.json') }}
    - name: Verify or download the public Whisper fixture
      run: |
        python -X utf8 windows-app/sandbox/prepare_test_model.py --destination "$env:RUNNER_TEMP/vd-public-whisper" --output dist/installed-acceptance/model-provenance.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Cache public Ollama dependency and test model for optional acceptance
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ${{ runner.temp }}/vd-ollama-downloads
          ${{ runner.temp }}/vd-public-ollama-models
        key: windows-public-ollama-${{ hashFiles('windows-app/sandbox/ollama-test-input.json') }}-${{ inputs.ollama_model
          || 'qwen3.5:0.8b' }}
    - name: Prepare isolated real Ollama and the requested public model
      env:
        TEST_OLLAMA_MODEL: ${{ inputs.ollama_model || 'qwen3.5:0.8b' }}
      run: |
        ./windows-app/sandbox/Prepare-TestOllama.ps1 -CacheDirectory "$env:RUNNER_TEMP/vd-ollama-downloads" -TargetDirectory "$env:RUNNER_TEMP/vd-ollama-install" -ModelDirectory "$env:RUNNER_TEMP/vd-public-ollama-models" -Model $env:TEST_OLLAMA_MODEL -HostAddress 127.0.0.1:11439 -ReportPath dist/ollama-acceptance/dependency.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: One installed API/UI CPU + Ollama, translation, notes, editing and exports acceptance
      env:
        TEST_OLLAMA_MODEL: ${{ inputs.ollama_model || 'qwen3.5:0.8b' }}
      run: |
        $fixture = Get-Content dist/installed-acceptance/model-provenance.json -Raw | ConvertFrom-Json
        python -X utf8 windows-app/verify_installed.py --ui --installer "$env:VD_INSTALLER" --zip "$env:VD_ZIP" --model $fixture.model_directory --output dist/ollama-acceptance/report.json --with-ollama --ollama-url http://127.0.0.1:11439 --ollama-model $env:TEST_OLLAMA_MODEL
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Stop only the optional acceptance Ollama process
      run: |
        if (Test-Path dist/ollama-acceptance/dependency.json) {
          $dependency = Get-Content dist/ollama-acceptance/dependency.json -Raw | ConvertFrom-Json
          $process = Get-Process -Id $dependency.server_pid -ErrorAction SilentlyContinue
          $expected = [IO.Path]::GetFullPath("$env:RUNNER_TEMP/vd-ollama-install/ollama.exe")
          if ($process -and $process.Path -eq $expected) { Stop-Process -Id $process.Id -Force }
        }
      if: always()
    - name: Retain only successful distributable artifacts and acceptance evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VideoDescriptor-full-acceptance
        path: |-
          dist/*.zip
          dist/*-setup.exe
          dist/SHA256SUMS.json
          dist/acceptance-provenance.json
          dist/verification-*.json
          dist/installed-acceptance/**
          dist/ollama-acceptance/**
        if-no-files-found: error
        retention-days: 14
    - name: Retain failure reports without distributing unaccepted binaries
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: full-acceptance-failure
        path: |-
          dist/verification-*.json
          dist/installed-acceptance/**
          dist/ollama-acceptance/**
        retention-days: 7
  container:
    uses: ./.github/workflows/container-smoke.yml
    with:
      retain_image: true
