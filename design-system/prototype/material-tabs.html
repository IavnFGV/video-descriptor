<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прототип вкладок материала</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css">
<style>body{max-width:1000px;margin:auto;padding:24px;font-family:var(--vd-font);background:var(--vd-canvas);color:var(--vd-text)}[role=tablist]{display:flex;gap:8px;margin-bottom:16px}[role=tab]{flex:1}[aria-selected=true]{background:var(--vd-accent-tint);border-color:var(--vd-accent)}[role=tabpanel]{padding:16px;border:1px solid var(--vd-border);border-radius:var(--vd-radius-card)}label{display:grid;gap:8px}.vd-actions{margin-block:8px 16px}select{width:100%}</style>
<h1>Материалы записи</h1><p>Отдельный прототип расположения. Данные демонстрационные, API не вызывается.</p>
<div role="tablist" aria-label="Материал записи"><button role="tab" id="tab-notes" aria-controls="panel" aria-selected="true">Конспект</button><button role="tab" id="tab-article" aria-controls="panel" aria-selected="false" tabindex="-1">Статья</button></div>
<div id="panel" role="tabpanel" aria-labelledby="tab-notes"><label id="version-label">Версия конспекта<select><option>Версия 2</option><option>Версия 1</option></select></label><div class="vd-actions"><button>Открыть</button><button id="create">Создать конспект</button></div><h2 id="heading">Конспект</h2><p>Здесь находится редактор выбранной версии. Переключение с несохранёнными правками блокируется с пояснением.</p></div>
<script>const tabs=[...document.querySelectorAll('[role=tab]')];function select(tab){tabs.forEach(t=>{t.setAttribute('aria-selected',String(t===tab));t.tabIndex=t===tab?0:-1});const article=tab.id==='tab-article';document.querySelector('#panel').setAttribute('aria-labelledby',tab.id);document.querySelector('#version-label').firstChild.textContent=article?'Версия статьи':'Версия конспекта';document.querySelector('#create').textContent=article?'Создать статью':'Создать конспект';document.querySelector('#heading').textContent=article?'Статья':'Конспект'}tabs.forEach((tab,i)=>{tab.onclick=()=>select(tab);tab.onkeydown=e=>{let target=e.key==='Home'?tabs[0]:e.key==='End'?tabs[1]:['ArrowLeft','ArrowRight'].includes(e.key)?tabs[1-i]:null;if(target){e.preventDefault();select(target);target.focus()}}});</script></html>
